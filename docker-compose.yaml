services:
  # Service 1: n8n (Workflow Automation)
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: scraper_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n.local
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - GENERIC_TIMEZONE=Europe/Warsaw
      - TZ=Europe/Warsaw
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_SECURE_COOKIE=false
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./workflows:/home/node/workflows
    # Explicitly depends on scraper so they start in order (optional but good)
    depends_on:
      - scraper_api
  scraper_api:
    build: .
    container_name: scraper_api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
